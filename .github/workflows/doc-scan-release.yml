name: doc-scan release

on:
  push:
    paths:
      - "doc-scan/**"
      - ".github/workflows/doc-scan-release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doc-scan/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: doc-scan
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doc-scan/package-lock.json
      - run: npm ci
      - name: Build installer
        shell: bash
        run: npx electron-builder ${{ matrix.args }} --publish never "-c.extraMetadata.version=${{ env.VERSION }}"
      - uses: actions/upload-artifact@v4
        with:
          name: docscan-${{ matrix.os }}
          if-no-files-found: error
          path: |
            doc-scan/dist/*.exe
            doc-scan/dist/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List files
        run: ls -l artifacts
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: doc-scan-v${{ env.VERSION }}
          name: DocScan ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          body: |
            Draft untuk pengecekan. Build dari commit ${{ github.sha }} (branch `${{ github.ref_name }}`).

            **Windows**: jalankan `DocScan-*-win-x64.exe`. SmartScreen mungkin memberi peringatan karena installer belum ditandatangani: pilih "More info" lalu "Run anyway".

            **macOS**: pilih `arm64` untuk Mac Apple Silicon (M1 dan setelahnya), `x64` untuk Mac Intel. Aplikasi belum ditandatangani Apple. Jika diblokir, klik kanan aplikasi lalu Open, atau jalankan `xattr -cr /Applications/DocScan.app`.

            **Pemindai**: pemindai jaringan yang mendukung AirScan (eSCL) bekerja di Windows dan macOS. Pemindai USB hanya didukung di Windows (WIA). Lihat `doc-scan/README.md`.
          files: |
            artifacts/*.exe
            artifacts/*.dmg
